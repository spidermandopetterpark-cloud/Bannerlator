import java.net.URL

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.21'
    }
}

plugins {
    id 'com.android.application'
}

apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// ============================================================
// IMAGEFS
// ============================================================

def IMAGEFS_URL =
        "https://github.com/The412Banner/winlator-contents/releases/download/base-assets-v1/imagefs.tar.zst"

// IMPORTANTE:
// Esta linha fica exatamente neste formato porque o GitHub Actions
// procura por imageFSSha256 no app/build.gradle.
def imageFSSha256 = "7838756e6a05c91afff68f4bf12aa2780f815877753f8dd354e203e99b9caf8a"

tasks.register("downloadImageFS") {

    File assetDir = new File(
            project.rootDir,
            ["app", "src", "main", "assets"].join(File.separator)
    )

    File imageFS = new File(
            assetDir,
            "imagefs.tar.zst"
    )

    doLast {

        if (!assetDir.exists()) {
            assetDir.mkdirs()
        }

        if (!imageFS.exists()) {

            println("")
            println("========================================")
            println("        DOWNLOAD IMAGEFS")
            println("========================================")
            println("URL:")
            println(IMAGEFS_URL)
            println("")

            new URL(IMAGEFS_URL).withInputStream { input ->

                imageFS.withOutputStream { output ->
                    output << input
                }
            }

            println("ImageFS downloaded.")
            println("Verifying SHA-256...")

            def digest =
                    java.security.MessageDigest.getInstance("SHA-256")

            imageFS.eachByte(
                    1024 * 1024
            ) { buffer, length ->

                digest.update(
                        buffer,
                        0,
                        length
                )
            }

            String actualSha256 =
                    digest.digest()
                            .encodeHex()
                            .toString()
                            .toLowerCase()

            println("")
            println("Expected SHA-256:")
            println(imageFSSha256)

            println("")
            println("Actual SHA-256:")
            println(actualSha256)

            if (actualSha256 != imageFSSha256) {

                imageFS.delete()

                throw new GradleException(
                        "IMAGEFS SHA-256 CHECK FAILED\n" +
                        "Expected: ${imageFSSha256}\n" +
                        "Actual:   ${actualSha256}\n" +
                        "The downloaded file was deleted."
                )
            }

            println("")
            println("ImageFS checksum OK.")
            println("")
        }
        else {

            println(
                    "ImageFS already exists: ${imageFS.absolutePath}"
            )
        }
    }
}

// ============================================================
// KOTLIN BUILD SCRIPT MODEL
// ============================================================

tasks.register(
        "prepareKotlinBuildScriptModel"
) {}

// ============================================================
// PRE BUILD
// ============================================================

preBuild.dependsOn(downloadImageFS)

// ============================================================
// ANDROID
// ============================================================

android {

    namespace 'com.winlator.star'

    compileSdk 34

    buildToolsVersion "35.0.0"

    // ========================================================
    // DEFAULT CONFIG
    // ========================================================

    defaultConfig {

        minSdkVersion 26

        targetSdkVersion 28

        versionCode 72

        versionName "3.0.0-pre1"

        testInstrumentationRunner =
                "androidx.test.runner.AndroidJUnitRunner"

        // ====================================================
        // CMAKE
        // ====================================================

        externalNativeBuild {

            cmake {
                cppFlags ''
            }
        }

        // ====================================================
        // ARM64
        // ====================================================

        ndk {

            abiFilters 'arm64-v8a'
        }
    }

    // ========================================================
    // BUILD FEATURES
    // ========================================================

    buildFeatures {

        compose true

        buildConfig true
    }

    // ========================================================
    // JAVA
    // ========================================================

    compileOptions {

        sourceCompatibility JavaVersion.VERSION_17

        targetCompatibility JavaVersion.VERSION_17
    }

    // ========================================================
    // KOTLIN
    // ========================================================

    kotlinOptions {

        jvmTarget = '17'

        freeCompilerArgs += [
                '-Xskip-metadata-version-check'
        ]
    }

    // ========================================================
    // SIGNING
    // ========================================================

    signingConfigs {

        testkey {

            storeFile file(
                    "${rootDir}/keystore/testkey.p12"
            )

            storeType "PKCS12"

            storePassword "android"

            keyAlias "testkey"

            keyPassword "android"

            enableV1Signing = true

            enableV2Signing = true

            enableV3Signing = true
        }
    }

    // ========================================================
    // BUILD TYPES
    // ========================================================

    buildTypes {

        debug {

            minifyEnabled false

            signingConfig signingConfigs.testkey
        }

        release {

            minifyEnabled false

            signingConfig signingConfigs.testkey

            crunchPngs false
        }
    }

    // ========================================================
    // LINT
    // ========================================================

    lint {

        abortOnError false

        checkReleaseBuilds false
    }

    // ========================================================
    // FLAVOR DIMENSION
    // ========================================================

    flavorDimensions "version"

    // ========================================================
    // PRODUCT FLAVORS
    // ========================================================

    productFlavors {

        standard {

            dimension "version"

            applicationId "com.winlator.banner"

            resValue(
                    "string",
                    "app_name",
                    "Bannerlator Bionic"
            )
        }

        ludashi {

            dimension "version"

            applicationId "com.ludashi.benchmark"

            resValue(
                    "string",
                    "app_name",
                    "Bannerlator Bionic Ludashi"
            )
        }

        pubg {

            dimension "version"

            applicationId "com.tencent.ig"

            resValue(
                    "string",
                    "app_name",
                    "Bannerlator Bionic PuBG"
            )
        }
    }

    // ========================================================
    // NDK
    // ========================================================

    ndkVersion '29.0.14206865'

    // ========================================================
    // CMAKE
    // ========================================================

    externalNativeBuild {

        cmake {

            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    // ========================================================
    // PACKAGING
    // ========================================================

    packagingOptions {

        jniLibs {

            useLegacyPackaging = true

            pickFirsts += [
                    '**/libc++_shared.so'
            ]
        }
    }
}

// ============================================================
// OKHTTP COROUTINES
// ============================================================

configurations.all {

    exclude(
            group: 'com.squareup.okhttp3',
            module: 'okhttp-coroutines'
    )
}

// ============================================================
// DEPENDENCIES
// ============================================================

dependencies {

    // ========================================================
    // COMPOSE
    // ========================================================

    implementation platform(
            'androidx.compose:compose-bom:2024.02.00'
    )

    implementation 'androidx.compose.ui:ui'

    implementation 'androidx.compose.ui:ui-graphics'

    implementation 'androidx.compose.ui:ui-tooling-preview'

    implementation 'androidx.compose.material3:material3'

    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.activity:activity-compose:1.8.2'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'

    implementation 'androidx.navigation:navigation-compose:2.7.6'

    implementation 'io.coil-kt:coil-compose:2.6.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // ========================================================
    // ANDROIDX
    // ========================================================

    implementation 'androidx.appcompat:appcompat:1.4.0'

    implementation 'androidx.preference:preference:1.2.1'

    implementation 'com.google.android.material:material:1.4.0'

    implementation 'androidx.activity:activity-ktx:1.8.2'

    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    implementation 'androidx.recyclerview:recyclerview:1.2.0'

    implementation 'androidx.core:core-ktx:1.12.0'

    implementation 'androidx.core:core-splashscreen:1.0.1'

    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'

    // ========================================================
    // SHIZUKU
    // ========================================================

    /*
     * Shizuku API 13.1.5
     *
     * Permite comunicação com o serviço Shizuku
     * quando ele estiver iniciado via ADB/Wireless
     * Debugging ou root.
     *
     * A biblioteca NÃO transforma automaticamente
     * o aplicativo em root.
     */

    implementation 'dev.rikka.shizuku:api:13.1.5'

    // ========================================================
    // LIBSU
    // ========================================================

    implementation 'com.github.topjohnwu.libsu:core:6.0.0'

    // ========================================================
    // COMPRESSÃO
    // ========================================================

    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'

    implementation 'org.tukaani:xz:1.7'

    implementation 'org.apache.commons:commons-compress:1.20'

    // ========================================================
    // MIDI
    // ========================================================

    implementation files(
            'libs/MidiSynth/MidiSynth.jar'
    )

    // ========================================================
    // STEAM
    // ========================================================

    implementation 'in.dragonbra:javasteam:1.8.0'

    implementation 'in.dragonbra:javasteam-depotdownloader:1.8.0'

    // ========================================================
    // COROUTINES
    // ========================================================

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ========================================================
    // ZXING
    // ========================================================

    implementation 'com.google.zxing:core:3.5.3'

    // ========================================================
    // RETROFIT
    // ========================================================

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'

    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // ========================================================
    // OKHTTP
    // ========================================================

    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

    implementation 'com.squareup.okio:okio:3.16.0'

    // ========================================================
    // JSON
    // ========================================================

    implementation 'com.google.code.gson:gson:2.8.8'

    // ========================================================
    // SECURITY
    // ========================================================

    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    implementation 'org.bouncycastle:bcprov-jdk15on:1.68'

    implementation 'org.openjsse:openjsse:1.1.7'

    // ========================================================
    // IMAGE / SVG
    // ========================================================

    implementation 'com.github.bumptech.glide:glide:4.11.0'

    implementation 'com.caverock:androidsvg-aar:1.4'

    annotationProcessor(
            'com.github.bumptech.glide:compiler:4.11.0'
    )

    // ========================================================
    // UNIX SOCKET
    // ========================================================

    implementation 'com.kohlschutter.junixsocket:junixsocket-common:2.6.0'

    implementation 'com.kohlschutter.junixsocket:junixsocket-native-common:2.6.0'

    // ========================================================
    // UNIT TEST
    // ========================================================

    testImplementation 'junit:junit:4.13.2'

    testImplementation 'org.json:json:20231013'

    // ========================================================
    // ANDROID TEST
    // ========================================================

    androidTestImplementation platform(
            'androidx.compose:compose-bom:2024.02.00'
    )

    androidTestImplementation(
            'androidx.test.ext:junit:1.1.5'
    )

    androidTestImplementation(
            'androidx.test:runner:1.5.2'
    )

    androidTestImplementation(
            'androidx.compose.ui:ui-test-junit4'
    )
}
