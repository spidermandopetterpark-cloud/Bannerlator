import java.net.URL

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.21'
    }
}

plugins {
    id 'com.android.application'
}

apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// ============================================================
// IMAGEFS
// ============================================================

tasks.register("downloadImageFS") {

    def assetDir = new File(
            project.rootDir,
            ["app", "src", "main", "assets"]
                    .join(File.separator)
    )

    File imageFS =
            new File(assetDir, "imagefs.tar.zst")

    String imageFSURL =
            "https://github.com/The412Banner/winlator-contents/releases/download/base-assets-v1/imagefs.tar.zst"

    String imageFSSha256 =
            "7838756e6a05c91afff68f4bf12aa2780f815877753f8dd354e203e99b9caf8a"

    doLast {

        if (!imageFS.exists()) {

            println(
                    "ImageFS was not present, downloading...\n"
            )

            new URL(imageFSURL).withInputStream { i ->
                imageFS.withOutputStream {
                    it << i
                }
            }

            def digest =
                    java.security.MessageDigest
                            .getInstance("SHA-256")

            imageFS.eachByte(
                    1024 * 1024
            ) { buf, len ->
                digest.update(buf, 0, len)
            }

            def actual =
                    digest.digest()
                            .encodeHex()
                            .toString()

            if (actual != imageFSSha256) {

                imageFS.delete()

                throw new GradleException(
                        "imagefs.tar.zst checksum mismatch\n" +
                        "  expected ${imageFSSha256}\n" +
                        "  actual   ${actual}\n" +
                        "Deleted the download. Either the release asset changed or the transfer was truncated."
                )
            }

            println(
                    "ImageFS checksum OK (${actual})\n"
            )
        }
    }
}

tasks.register(
        "prepareKotlinBuildScriptModel"
) {}

preBuild.dependsOn(downloadImageFS)

// ============================================================
// ANDROID
// ============================================================

android {

    namespace 'com.winlator.star'

    compileSdk 34

    buildToolsVersion "35.0.0"

    defaultConfig {

        minSdkVersion 26

        targetSdkVersion 28

        versionCode 72

        versionName "3.0.0-pre1"

        testInstrumentationRunner =
                "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // ========================================================
    // BUILD FEATURES
    // ========================================================

    buildFeatures {

        compose true

        buildConfig true
    }

    // ========================================================
    // JAVA
    // ========================================================

    compileOptions {

        sourceCompatibility JavaVersion.VERSION_17

        targetCompatibility JavaVersion.VERSION_17
    }

    // ========================================================
    // KOTLIN
    // ========================================================

    kotlinOptions {

        jvmTarget = '17'

        freeCompilerArgs += [
                '-Xskip-metadata-version-check'
        ]
    }

    // ========================================================
    // SIGNING
    // ========================================================

    signingConfigs {

        testkey {

            storeFile file(
                    "${rootDir}/keystore/testkey.p12"
            )

            storeType "PKCS12"

            storePassword "android"

            keyAlias "testkey"

            keyPassword "android"

            enableV1Signing = true

            enableV2Signing = true

            enableV3Signing = true
        }
    }

    // ========================================================
    // BUILD TYPES
    // ========================================================

    buildTypes {

        debug {

            minifyEnabled false

            signingConfig signingConfigs.testkey
        }

        release {

            minifyEnabled false

            signingConfig signingConfigs.testkey

            crunchPngs false
        }
    }

    // ========================================================
    // LINT
    // ========================================================

    lint {

        abortOnError false

        checkReleaseBuilds false
    }

    // ========================================================
    // FLAVORS
    // ========================================================

    flavorDimensions "version"

    productFlavors {

        standard {

            dimension "version"

            applicationId "com.winlator.banner"

            resValue(
                    "string",
                    "app_name",
                    "Bannerlator Bionic"
            )
        }

        ludashi {

            dimension "version"

            applicationId "com.ludashi.benchmark"

            resValue(
                    "string",
                    "app_name",
                    "Bannerlator Bionic Ludashi"
            )
        }

        pubg {

            dimension "version"

            applicationId "com.tencent.ig"

            resValue(
                    "string",
                    "app_name",
                    "Bannerlator Bionic PuBG"
            )
        }
    }

    // ========================================================
    // NDK
    // ========================================================

    ndkVersion '29.0.14206865'

    externalNativeBuild {

        cmake {

            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    // ========================================================
    // PACKAGING
    // ========================================================

    packagingOptions {

        jniLibs {

            useLegacyPackaging = true

            pickFirsts += [
                    '**/libc++_shared.so'
            ]
        }
    }
}

// ============================================================
// OKHTTP COROUTINES
// ============================================================

configurations.all {

    exclude group: 'com.squareup.okhttp3',
            module: 'okhttp-coroutines'
}

// ============================================================
// DEPENDENCIES
// ============================================================

dependencies {

    // --------------------------------------------------------
    // COMPOSE
    // --------------------------------------------------------

    implementation platform(
            'androidx.compose:compose-bom:2024.02.00'
    )

    implementation 'androidx.compose.ui:ui'

    implementation 'androidx.compose.ui:ui-graphics'

    implementation 'androidx.compose.ui:ui-tooling-preview'

    implementation 'androidx.compose.material3:material3'

    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.activity:activity-compose:1.8.2'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'

    implementation 'androidx.navigation:navigation-compose:2.7.6'

    implementation 'io.coil-kt:coil-compose:2.6.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // --------------------------------------------------------
    // ANDROIDX
    // --------------------------------------------------------

    implementation 'androidx.appcompat:appcompat:1.4.0'

    implementation 'androidx.preference:preference:1.2.1'

    implementation 'com.google.android.material:material:1.4.0'

    implementation 'androidx.activity:activity-ktx:1.8.2'

    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    implementation 'androidx.recyclerview:recyclerview:1.2.0'

    implementation 'androidx.core:core-ktx:1.12.0'

    implementation 'androidx.core:core-splashscreen:1.0.1'

    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'

    // --------------------------------------------------------
    // SHIZUKU
    // --------------------------------------------------------

    /*
     * Shizuku API.
     *
     * Permite que o Bannerlator converse com o serviço
     * Shizuku quando o usuário o iniciou via ADB/Wireless
     * Debugging.
     *
     * NÃO concede root.
     */
    implementation 'dev.rikka.shizuku:api:13.1.5'

    // --------------------------------------------------------
    // ROOT / LIBSU
    // --------------------------------------------------------

    /*
     * Mantido para o RootManager existente.
     *
     * A presença desta biblioteca NÃO significa que
     * ZramManager precisa usar root.
     */
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'

    // --------------------------------------------------------
    // COMPRESSÃO / STORAGE
    // --------------------------------------------------------

    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'

    implementation 'org.tukaani:xz:1.7'

    implementation 'org.apache.commons:commons-compress:1.20'

    // --------------------------------------------------------
    // MIDI
    // --------------------------------------------------------

    implementation files(
            'libs/MidiSynth/MidiSynth.jar'
    )

    // --------------------------------------------------------
    // STEAM
    // --------------------------------------------------------

    implementation 'in.dragonbra:javasteam:1.8.0'

    implementation 'in.dragonbra:javasteam-depotdownloader:1.8.0'

    // --------------------------------------------------------
    // KOTLIN COROUTINES
    // --------------------------------------------------------

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // --------------------------------------------------------
    // ZXING
    // --------------------------------------------------------

    implementation 'com.google.zxing:core:3.5.3'

    // --------------------------------------------------------
    // NETWORK
    // --------------------------------------------------------

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'

    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

    implementation 'com.squareup.okio:okio:3.16.0'

    // --------------------------------------------------------
    // JSON
    // --------------------------------------------------------

    implementation 'com.google.code.gson:gson:2.8.8'

    // --------------------------------------------------------
    // SECURITY
    // --------------------------------------------------------

    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    implementation 'org.bouncycastle:bcprov-jdk15on:1.68'

    implementation 'org.openjsse:openjsse:1.1.7'

    // --------------------------------------------------------
    // IMAGE / SVG
    // --------------------------------------------------------

    implementation 'com.github.bumptech.glide:glide:4.11.0'

    implementation 'com.caverock:androidsvg-aar:1.4'

    annotationProcessor(
            'com.github.bumptech.glide:compiler:4.11.0'
    )

    // --------------------------------------------------------
    // UNIX SOCKET
    // --------------------------------------------------------

    implementation 'com.kohlschutter.junixsocket:junixsocket-common:2.6.0'

    implementation 'com.kohlschutter.junixsocket:junixsocket-native-common:2.6.0'

    // --------------------------------------------------------
    // TEST
    // --------------------------------------------------------

    testImplementation 'junit:junit:4.13.2'

    testImplementation 'org.json:json:20231013'

    androidTestImplementation platform(
            'androidx.compose:compose-bom:2024.02.00'
    )

    androidTestImplementation(
            'androidx.test.ext:junit:1.1.5'
    )

    androidTestImplementation(
            'androidx.test:runner:1.5.2'
    )

    androidTestImplementation(
            'androidx.compose.ui:ui-test-junit4'
    )
}
